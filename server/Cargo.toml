[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared" }
tokio = { version = "1.28", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
sysinfo = "0.29"
uuid = { version = "1.3", features = ["v4"] }
argon2 = { version = "0.5", features = ["std"] }
password-hash = "0.5.0"
rand_core = "0.6.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"

